# PSA-1 local Postgres only. Schema/Prisma arrive in PSA-2.
services:
  postgres:
    image: postgres:16-alpine
    container_name: sounds-university-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sounds
      POSTGRES_PASSWORD: sounds
      POSTGRES_DB: sounds_university
    ports:
      - '5432:5432'
    volumes:
      - sounds_university_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sounds -d sounds_university']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sounds_university_pg:
